name: recall
description: "A production-grade mobile learning platform optimizing memory retention via Spaced Repetition."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation & Routing
  go_router: ^13.2.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Network & API Proxy requests
  dio: ^5.4.0

  # Local Persistence (Offline Cache Hive)
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Decorative Packages
  lucide_icons: ^0.320.0
  google_fonts: ^6.1.0
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
